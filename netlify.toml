[build]
  base    = "app-next"
  command = "npm run build"
  publish = ".next"

# Secrets and integration credentials are intentionally NOT declared here:
# empty-string values in [build.environment] shadow UI-scoped variables during
# the build, and a committed skeleton invites pasting real values into git.
# Configure them in the Netlify UI (Site settings → Environment variables),
# scoped to Functions/runtime. Required variables are listed in app-next/README.md.
[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
