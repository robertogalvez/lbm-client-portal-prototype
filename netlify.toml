[build]
  base    = "app-next"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION        = "22"
  CLICKUP_FOLDER_ID   = ""
  CLICKUP_LIST_ID     = ""
  CLICKUP_CLIENTS_LIST_ID = ""
  CLICKUP_API_TOKEN   = ""
  DATABASE_URL        = ""
  POSTMARK_API_KEY    = ""
  FRAMEIO_API_TOKEN   = ""
  FRAMEIO_ACCOUNT_ID  = ""
  FRAMEIO_CLIENT_ID     = ""
  FRAMEIO_CLIENT_SECRET = ""
  FRAMEIO_OAUTH_SCOPES  = ""
  VISTASOCIAL_API_TOKEN = ""
  VISTASOCIAL_API_BASE  = ""
  CRON_SECRET         = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"
