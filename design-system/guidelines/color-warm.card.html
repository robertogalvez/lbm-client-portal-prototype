<!-- @dsCard group="Colors" viewport="700x160" subtitle="Warm surfaces — client / mobile, consumer feel" name="Warm (Client)" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--m-surface);padding:18px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:16px;min-height:76px;border:1px solid var(--m-line)}
  .sw .nm{font-size:11px;font-weight:700}
  .sw .hex{font-family:var(--font-mono);font-size:10px;opacity:.8}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--m-bg)"><span class="nm">m-bg</span><span class="hex">#faf6f0</span></div>
    <div class="sw" style="background:var(--m-surface-2)"><span class="nm">m-surface-2</span><span class="hex">#f7f2ea</span></div>
    <div class="sw" style="background:var(--m-ink);color:#fff;border-color:transparent"><span class="nm">m-ink</span><span class="hex">#221e18</span></div>
    <div class="sw" style="background:var(--m-ink-2);color:#fff;border-color:transparent"><span class="nm">m-ink-2</span><span class="hex">#6c6357</span></div>
    <div class="sw" style="background:var(--m-line)"><span class="nm">m-line</span><span class="hex">#ece4d8</span></div>
    <div class="sw" style="background:var(--warm-accent);color:#fff;border-color:transparent"><span class="nm">warm-accent</span><span class="hex">#FF6000</span></div>
    <div class="sw" style="background:var(--warm-accent-tint);color:var(--brand-darker)"><span class="nm">accent-tint</span><span class="hex">#fff1e8</span></div>
  </div>
</body></html>
