<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:14px;min-height:64px;color:#fff}
  .nm{font-size:12px;font-weight:700}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.85}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--clickup)"><span class="nm">ClickUp</span><span class="hex">#7B68EE</span></div>
    <div class="sw" style="background:var(--frameio)"><span class="nm">Frame.io</span><span class="hex">#5b6bff</span></div>
    <div class="sw" style="background:var(--whatsapp)"><span class="nm">WhatsApp</span><span class="hex">#1FA855</span></div>
  </div>
</body></html>
