<!-- @dsCard group="Type" viewport="700x230" subtitle="Plus Jakarta Sans — UI type scale" name="Display & headings" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;color:var(--ink)}
  .stack{display:flex;flex-direction:column;gap:13px}
  .line{display:flex;align-items:baseline;gap:14px}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:118px;flex:none}
  .d{font-size:var(--fs-display);font-weight:600;letter-spacing:var(--ls-tight)}
  .h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:var(--ls-tight)}
  .h2{font-size:var(--fs-h2);font-weight:700;letter-spacing:var(--ls-snug)}
  .h3{font-size:var(--fs-h3);font-weight:700;letter-spacing:var(--ls-snug)}
  .ti{font-size:var(--fs-title);font-weight:700;letter-spacing:var(--ls-snug)}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">display / 30 / 600</span><span class="d">73%</span></div>
    <div class="line"><span class="tag">h1 / 25 / 800</span><span class="h1">Editing operations</span></div>
    <div class="line"><span class="tag">h2 / 21 / 700</span><span class="h2">Model home tour — Birchwood</span></div>
    <div class="line"><span class="tag">h3 / 17 / 700</span><span class="h3">Account managers</span></div>
    <div class="line"><span class="tag">title / 15 / 700</span><span class="ti">Editor marketplace leaderboard</span></div>
  </div>
</body></html>
