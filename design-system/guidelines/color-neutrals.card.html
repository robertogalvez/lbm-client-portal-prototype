<!-- @dsCard group="Colors" viewport="700x160" subtitle="Cool neutrals — admin / desktop surfaces & text" name="Neutrals (Admin)" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:18px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:16px;min-height:76px;border:1px solid var(--line)}
  .sw .nm{font-size:11px;font-weight:700}
  .sw .hex{font-family:var(--font-mono);font-size:10px;opacity:.8}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--page)"><span class="nm">page</span><span class="hex">#eceef1</span></div>
    <div class="sw" style="background:var(--surface)"><span class="nm">surface</span><span class="hex">#ffffff</span></div>
    <div class="sw" style="background:var(--ink);color:#fff;border-color:transparent"><span class="nm">ink</span><span class="hex">#111c28</span></div>
    <div class="sw" style="background:var(--ink-2);color:#fff;border-color:transparent"><span class="nm">ink-2</span><span class="hex">#54616f</span></div>
    <div class="sw" style="background:var(--ink-3);color:#fff;border-color:transparent"><span class="nm">ink-3</span><span class="hex">#8b97a4</span></div>
    <div class="sw" style="background:var(--line)"><span class="nm">line</span><span class="hex">#e7ebef</span></div>
    <div class="sw" style="background:var(--hover)"><span class="nm">hover</span><span class="hex">#f5f7f9</span></div>
  </div>
</body></html>
