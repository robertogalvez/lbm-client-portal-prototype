<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Soft, low shadows — flat & modern, never heavy" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--page);padding:26px}
  .row{display:flex;gap:22px}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:120px;height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .nm{font-size:11px;font-weight:700;color:var(--ink-2)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="nm">xs · controls</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><span class="nm">card · hover</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-pop)"></div><span class="nm">pop · lift</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-frame)"></div><span class="nm">frame · outer</span></div>
  </div>
</body></html>
