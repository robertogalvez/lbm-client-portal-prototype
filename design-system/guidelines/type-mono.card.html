<!-- @dsCard group="Type" viewport="700x180" subtitle="IBM Plex Mono — all figures, dates, IDs use tabular nums" name="Mono / data figures" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;color:var(--ink)}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:14px}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:118px;flex:none}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .big{font-size:28px;font-weight:600;letter-spacing:var(--ls-tight)}
  .mid{font-size:14px;font-weight:600;color:var(--ink-2)}
  .pill{font-family:var(--font-mono);font-size:11px;color:var(--brand-dark);background:var(--brand-tint);padding:2px 7px;border-radius:5px;font-weight:600}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">metric value</span><span class="mono big">3.2<span style="font-size:14px;color:var(--ink-3)"> days</span></span></div>
    <div class="line"><span class="tag">dates / counts</span><span class="mono mid">Jun&nbsp;11&nbsp;&nbsp;·&nbsp;&nbsp;11/12&nbsp;&nbsp;·&nbsp;&nbsp;4.2h&nbsp;&nbsp;·&nbsp;&nbsp;0:41</span></div>
    <div class="line"><span class="tag">IDs / timecodes</span><span class="mono mid">#LBM-1042</span><span class="pill">0:28</span></div>
  </div>
</body></html>
