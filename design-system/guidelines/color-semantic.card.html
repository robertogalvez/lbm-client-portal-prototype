<!-- @dsCard group="Colors" viewport="700x150" subtitle="Semantic status — paired text + tint backgrounds" name="Semantic status" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:18px}
  .row{display:flex;gap:10px}
  .col{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--radius-xs);line-height:1.3}
  .dot{width:6px;height:6px;border-radius:50%}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);padding-left:2px}
</style></head>
<body>
  <div class="row">
    <div class="col"><span class="chip" style="color:var(--blue);background:var(--blue-bg)"><span class="dot" style="background:var(--blue)"></span>In Progress</span><span class="hex">blue #2563eb</span></div>
    <div class="col"><span class="chip" style="color:var(--amber);background:var(--amber-bg)"><span class="dot" style="background:var(--amber)"></span>In Review</span><span class="hex">amber #b06f06</span></div>
    <div class="col"><span class="chip" style="color:var(--green);background:var(--green-bg)"><span class="dot" style="background:var(--green)"></span>Approved</span><span class="hex">green #14805f</span></div>
    <div class="col"><span class="chip" style="color:var(--red);background:var(--red-bg)"><span class="dot" style="background:var(--red)"></span>Changes</span><span class="hex">red #cf3f36</span></div>
    <div class="col"><span class="chip" style="color:var(--slate);background:var(--slate-bg)"><span class="dot" style="background:var(--slate)"></span>To Do</span><span class="hex">slate #54616f</span></div>
    <div class="col"><span class="chip" style="color:var(--violet);background:var(--violet-bg)"><span class="dot" style="background:var(--violet)"></span>QC</span><span class="hex">violet #7c66c4</span></div>
  </div>
</body></html>
