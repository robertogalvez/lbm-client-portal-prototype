<!-- @dsCard group="Type" viewport="700x210" subtitle="Body, labels, and uppercase eyebrows" name="Body & labels" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;color:var(--ink)}
  .stack{display:flex;flex-direction:column;gap:13px}
  .line{display:flex;align-items:baseline;gap:14px}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:118px;flex:none}
  .body{font-size:var(--fs-body);font-weight:400;color:var(--ink-2)}
  .bsm{font-size:var(--fs-body-sm);font-weight:500;color:var(--ink-2)}
  .lab{font-size:var(--fs-label);font-weight:600}
  .eye{font-size:var(--fs-micro);font-weight:700;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--brand-darker)}
  .th{font-size:var(--fs-micro);font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-3)}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">body / 14 / 400</span><span class="body">Finished videos land here for client sign-off via embedded Frame.io.</span></div>
    <div class="line"><span class="tag">body-sm / 13 / 500</span><span class="bsm">Synced from ClickUp · updated 2 min ago</span></div>
    <div class="line"><span class="tag">label / 12.5 / 600</span><span class="lab">First-pass approval</span></div>
    <div class="line"><span class="tag">eyebrow / 11 / 700</span><span class="eye">June social package</span></div>
    <div class="line"><span class="tag">table-head / 11</span><span class="th">Turnaround · First-pass · Rating</span></div>
  </div>
</body></html>
