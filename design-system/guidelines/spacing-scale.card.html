<!-- @dsCard group="Spacing" viewport="700x140" subtitle="4px base spacing scale" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:20px}
  .row{display:flex;align-items:flex-end;gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:7px}
  .box{background:var(--brand);border-radius:3px}
  .nm{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="width:4px;height:4px"></div><span class="nm">1·4</span></div>
    <div class="item"><div class="box" style="width:8px;height:8px"></div><span class="nm">2·8</span></div>
    <div class="item"><div class="box" style="width:12px;height:12px"></div><span class="nm">3·12</span></div>
    <div class="item"><div class="box" style="width:16px;height:16px"></div><span class="nm">4·16</span></div>
    <div class="item"><div class="box" style="width:20px;height:20px"></div><span class="nm">5·20</span></div>
    <div class="item"><div class="box" style="width:24px;height:24px"></div><span class="nm">6·24</span></div>
    <div class="item"><div class="box" style="width:32px;height:32px"></div><span class="nm">8·32</span></div>
    <div class="item"><div class="box" style="width:40px;height:40px"></div><span class="nm">10·40</span></div>
    <div class="item"><div class="box" style="width:48px;height:48px"></div><span class="nm">12·48</span></div>
  </div>
</body></html>
