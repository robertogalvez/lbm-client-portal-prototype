<!-- @dsCard group="Components" viewport="700x120" subtitle="Initials avatars — palette & sizes" name="Avatar" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;color:var(--ink)}
  .row{display:flex;gap:14px;align-items:center}
  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.01em}
  .sm{width:22px;height:22px;font-size:9.5px}.md{width:28px;height:28px;font-size:11px}.lg{width:34px;height:34px;font-size:12.5px}
  .brand{background:var(--brand)}.slate{background:#5e6b7a}.blue{background:#5172c4}.amber{background:#b58236}.violet{background:#7c66c4}.red{background:#cf5b53}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:54px;flex:none}
  .sep{width:1px;height:34px;background:var(--line);margin:0 6px}
</style></head>
<body>
  <div class="row">
    <span class="lbl">palette</span>
    <span class="av md brand">LF</span><span class="av md slate">SM</span><span class="av md blue">JR</span><span class="av md amber">PT</span><span class="av md violet">EL</span><span class="av md red">DC</span>
    <span class="sep"></span>
    <span class="lbl">size</span>
    <span class="av sm slate">SM</span><span class="av md slate">SM</span><span class="av lg slate">SM</span>
  </div>
</body></html>
