<!-- @dsCard group="Components" viewport="700x150" subtitle="Status pills — cool (admin) + warm (client)" name="StatusBadge" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface);padding:22px;color:var(--ink)}
  .grid{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:54px;flex:none}
  .b{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--radius-xs);line-height:1.35}
  .b.warm{font-weight:700;padding:5px 10px;border-radius:9px}
  .d{width:6px;height:6px;border-radius:50%}
  .blue{color:var(--blue);background:var(--blue-bg)}.blue .d{background:var(--blue)}
  .amber{color:var(--amber);background:var(--amber-bg)}.amber .d{background:var(--amber)}
  .green{color:var(--green);background:var(--green-bg)}.green .d{background:var(--green)}
  .red{color:var(--red);background:var(--red-bg)}.red .d{background:var(--red)}
  .slate{color:var(--slate);background:var(--slate-bg)}.slate .d{background:var(--slate)}
  .violet{color:var(--violet);background:var(--violet-bg)}.violet .d{background:var(--violet)}
  .wamber{color:var(--amber);background:var(--m-amber-bg)}.wamber .d{background:var(--amber)}
  .wgreen{color:var(--green);background:var(--m-green-bg)}.wgreen .d{background:var(--green)}
  .wred{color:var(--red);background:var(--m-red-bg)}.wred .d{background:var(--red)}
</style></head>
<body>
  <div class="grid">
    <div class="row"><span class="lbl">cool</span>
      <span class="b blue"><span class="d"></span>In Progress</span>
      <span class="b amber"><span class="d"></span>Awaiting Approval</span>
      <span class="b green"><span class="d"></span>Approved</span>
      <span class="b red"><span class="d"></span>Changes</span>
      <span class="b slate"><span class="d"></span>To Do</span>
      <span class="b violet"><span class="d"></span>QC</span>
    </div>
    <div class="row"><span class="lbl">warm</span>
      <span class="b warm wamber"><span class="d"></span>Awaiting your review</span>
      <span class="b warm wgreen"><span class="d"></span>Approved</span>
      <span class="b warm wred"><span class="d"></span>Changes</span>
    </div>
  </div>
</body></html>
